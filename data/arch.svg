<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="720" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .layer { fill:#ffffff; stroke:#2b6cb0; stroke-width:2; rx:12; ry:12; }
    .layer-title { font: 600 18px "Segoe UI", Roboto, Arial; fill:#2b6cb0; }
    .note { font: 400 13px "Segoe UI", Roboto, Arial; fill:#2d3748; }
    .box { fill:#f7fafc; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
    .box-title { font: 600 14px "Segoe UI", Roboto, Arial; fill:#1a202c; }
    .box-sub { font: 400 12px "Segoe UI", Roboto, Arial; fill:#4a5568; }
    .arrow { stroke:#2b6cb0; stroke-width:2; fill:none; marker-end: url(#arrowhead); }
    .small { font: 400 11px "Segoe UI", Roboto, Arial; fill:#2d3748; }
  </style>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2b6cb0"></path>
    </marker>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Top title -->
  <text x="30" y="28" class="layer-title">VisionSearch — Layered Architecture</text>
  <text x="30" y="48" class="note">First goal: implement working Ingest + Retrieve pipelines (CPU-only ResNet50 prototype)</text>

  <!-- Application Layer -->
  <g transform="translate(40,70)" filter="url(#f1)">
    <rect class="layer" width="920" height="100"></rect>
    <text x="18" y="36" class="layer-title">Application Layer</text>
    <text x="18" y="62" class="note">Ingest Service · Search Service · Orchestration · Config & API</text>

    <!-- Ingest / Search boxes inside App layer -->
    <g transform="translate(640,14)">
      <rect class="box" width="250" height="72"></rect>
      <text x="12" y="34" class="box-title">Ingest</text>
      <text x="12" y="52" class="box-sub">trigger pipelines · manage jobs</text>
    </g>
    <g transform="translate(370,14)">
      <rect class="box" width="250" height="72"></rect>
      <text x="12" y="34" class="box-title">Retrieve / Search</text>
      <text x="12" y="52" class="box-sub">query pipelines · return results</text>
    </g>
  </g>

  <!-- Arrow down from Application to Pipeline Layer -->
  <path class="arrow" d="M500 170 L500 210" />
  
  <!-- Pipeline Layer -->
  <g transform="translate(40,220)" filter="url(#f1)">
    <rect class="layer" width="920" height="160"></rect>
    <text x="18" y="36" class="layer-title">Pipeline Layer</text>
    <text x="18" y="62" class="note">GStreamer pipelines composed of elements (queue/threads per stage)</text>

    <!-- Ingest pipeline box -->
    <g transform="translate(40,86)">
      <rect class="box" width="420" height="56"></rect>
      <text x="12" y="30" class="box-title">Ingest Pipeline</text>
      <text x="12" y="46" class="box-sub">Source → Preprocess → Inference → Postprocess → VectorDB Sink</text>
    </g>

    <!-- Retrieve pipeline box -->
    <g transform="translate(500,86)">
      <rect class="box" width="420" height="56"></rect>
      <text x="12" y="30" class="box-title">Retrieve Pipeline</text>
      <text x="12" y="46" class="box-sub">Query Source → Preprocess → Inference → VectorDB Search → Result Sink</text>
    </g>
  </g>

  <!-- Arrow down from pipelines to plugin layer -->
  <path class="arrow" d="M500 380 L500 420" />

  <!-- Plugin / Element Layer -->
  <g transform="translate(40,440)" filter="url(#f1)">
    <rect class="layer" width="920" height="160"></rect>
    <text x="18" y="36" class="layer-title">Plugin / Element Layer</text>
    <text x="18" y="62" class="note">Modular GStreamer elements (atomic operations)</text>

    <!-- boxes for plugin types -->
    <g transform="translate(30,86)">
      <rect class="box" width="220" height="60"></rect>
      <text x="12" y="30" class="box-title">Source / Sink</text>
      <text x="12" y="48" class="box-sub">disk · s3 · gdrive · rtsp</text>
    </g>

    <g transform="translate(280,86)">
      <rect class="box" width="220" height="60"></rect>
      <text x="12" y="30" class="box-title">Preprocess</text>
      <text x="12" y="48" class="box-sub">resize · normalize · augment</text>
    </g>

    <g transform="translate(530,86)">
      <rect class="box" width="220" height="60"></rect>
      <text x="12" y="30" class="box-title">Inference</text>
      <text x="12" y="48" class="box-sub">LibTorch (ResNet50) · CPU</text>
    </g>
  </g>

  <!-- Arrow down to core -->
  <path class="arrow" d="M500 600 L500 630" />

  <!-- Core / Infrastructure Layer -->
  <g transform="translate(40,660)">
    <rect class="layer" width="920" height="120"></rect>
    <text x="18" y="28" class="layer-title">Core / Infrastructure Layer</text>
    <text x="18" y="52" class="note">CoreMetadata · BenchmarkRecorder · VectorDBClient · Config · Logging</text>

    <!-- small boxes for core pieces -->
    <g transform="translate(40,68)">
      <rect width="240" height="36" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="90" class="small">CoreMetadata (GstMeta wrapper)</text>
    </g>
    <g transform="translate(320,68)">
      <rect width="240" height="36" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="312" y="90" class="small" transform="translate(-300,0)">BenchmarkRecorder (SQLite WAL async)</text>
    </g>
    <g transform="translate(600,68)">
      <rect width="240" height="36" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="612" y="90" class="small" transform="translate(-600,0)">VectorDBClient (FAISS + metadata)</text>
    </g>
  </g>

  <!-- footer note -->
  <text x="30" y="715" class="note">Diagram: Application → Pipeline → Plugin → Core. Save as docs/architecture.svg and embed in README with <img src="docs/architecture.svg" alt="Architecture diagram" /></text>
</svg>
SVG
